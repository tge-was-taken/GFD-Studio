name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Everything builds on all three platforms now, so the whole solution is built on each.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build GFDStudio.slnx -c Release

      # The test data is not in the repository, so the tests only run where it is available.
      - id: testdata
        shell: bash
        run: |
          if [ -d Resources/TestData ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Resources/TestData is absent, skipping the tests"
          fi

      - if: steps.testdata.outputs.available
        run: dotnet test tests/GFDLibrary.Tests/GFDLibrary.Tests.csproj -c Release --no-build

  # The native libraries are built on every platform GFDLibrary runs on, so a break in either
  # shim shows up here rather than at release time.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-native

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            src/native/GFDLibrary.Native.DirectXTex/out/DirectXTexC.*
            src/native/GFDLibrary.Native.FbxSdk/out/FbxSdkC.*
          if-no-files-found: error

  # A master build is released as the next 0.10 patch version, with the commit it was built from.
  # Other branches get artifacts but no tag.
  version:
    needs: [build, native]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -eu
          # Release candidates for 1.0.0, numbered from the ones already published.
          rc=$(git tag --list 'v1.0.0-rc*' \
            | sed -nE 's/^v1\.0\.0-rc\.?([0-9]+).*$/\1/p' | sort -n | tail -1)
          rc=$((${rc:-0} + 1))
          echo "tag=v1.0.0-rc.$rc-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Downloadable per commit builds, as the AppVeyor builds used to be.
  binaries:
    needs: version
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
