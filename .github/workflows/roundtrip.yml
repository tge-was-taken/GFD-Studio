name: Round trip

on:
  push:
    branches: [master, v1]
  pull_request:
  workflow_dispatch:
    inputs:
      sample:
        description: Take every Nth corpus file. 1 runs all of them.
        type: string
        required: false
        default: '1'
      games:
        description: Comma separated game tags to limit the run to. Empty runs all.
        type: string
        required: false
        default: ''

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The corpus is a private repo, so a pull request from a fork cannot reach it. Anywhere
      # else a missing key is a broken workflow, not a reason to pass.
      - id: corpus
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = true ]; then
            echo "::warning::corpus unavailable to a fork, skipping the round trip"
          else
            echo "::error::ASSETS_DEPLOY_KEY is not set, so the corpus cannot be checked out"
            exit 1
          fi
        env:
          KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}

      - if: steps.corpus.outputs.available
        uses: actions/checkout@v4
        with:
          repository: tge-was-taken/GFD-Studio-Assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: corpus

      - if: steps.corpus.outputs.available
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - if: steps.corpus.outputs.available
        run: dotnet publish src/GFDStudio.Cli/GFDStudio.Cli.csproj -c Release -o cli

      # Reading a model costs several times its size on disk, so the budget is well under what
      # the runner has. A pull request takes a sample; the slice rotates with the run number so
      # repeated runs cover the whole corpus rather than the same tenth of it.
      - if: steps.corpus.outputs.available
        run: |
          ./cli/gfdstudio roundtrip corpus \
            --results results.txt \
            --memory-budget 2048 \
            --sample "${SAMPLE:-$DEFAULT_SAMPLE}" \
            --offset "$GITHUB_RUN_NUMBER" \
            ${GAMES:+--games "$GAMES"}
        env:
          SAMPLE: ${{ inputs.sample }}
          GAMES: ${{ inputs.games }}
          DEFAULT_SAMPLE: ${{ github.event_name == 'pull_request' && '10' || '1' }}

      - if: always() && steps.corpus.outputs.available
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-results
          path: results.txt
